# Hand-authored intent for the Flow (W.A.T.E.R.) system.
# Trello ids live in config/resolved.json, written by `flow discover` /
# `flow bootstrap` — never edit that file by hand, and never put ids here.

# Which lists play which role. Names are what the lists are actually called on
# your board; if yours are named differently, change the names here and
# `flow bootstrap` will map to them instead of creating new ones.
lists:
  in:
    name: "in"
  progressing:
    name: "progressing"
  out:
    name: "out"
  # Staging list for the nightly drain. Sits empty except for the instant at
  # 04:00 when Butler sweeps into it and archives it. It exists only because
  # Trello has no "archive cards in list X with label Y" action.
  drain:
    name: "drain"

# The label that separates daily W.A.T.E.R. cards from long-running work.
# The purge rule keys off this exclusively — an unlabelled card is never archived.
label:
  name: "Flow"
  colour: "sky"        # Trello's water blue

# The five daily activities — W.A.T.E.R., in order. See docs/05-water.md.
# Card titles must match these exactly: the Butler spawn rule creates them by
# literal name and the analysis joins on it.
# First sentence states the nature of the mode; second gives concrete practice.
# Both are duplicated in Butler rule 3 — change them together.
activities:
  - name: Write
    description: "Documenting or organising thoughts and actions. Planning, composing, journaling, outlining, structured notes."
  - name: Absorb
    description: "Absorbing new knowledge or information. Deliberate, focused input of knowledge or repertoire."
  - name: Train
    description: "Internalising through disciplined practice. Scales, drills, workouts — practice should be difficult so that performance is easy."
  - name: Express
    description: "Acting on unfiltered, authentic impulse and free association. Improvising, singing, sketching — no self-control."
  - name: Reveal
    description: "Exposing thoughts or actions to the broader culture. Live performance, streaming, publishing — leaving a documented record."

schedule:
  timezone: "Europe/London"   # must match the board's timezone in Trello
  drain_at: "04:00"           # must be earlier than refill_at
  refill_at: "06:00"
  # The analysis day runs drain-to-drain, not midnight-to-midnight, so a 01:00
  # completion is attributed to the previous day — matching what the board does.

# External production signal. Trello records that the practice ran; this records
# whether anything reached the world. Without it, "adherence without production"
# — high completion, flat output — is undetectable. See docs/06-diagnostics.md.
signals:
  forum:
    url: "https://forum.udaganuniverse.com"
    # Every post is fetched and classified locally rather than filtered by the
    # API, so that posts by *other people* — the reception signal — are visible
    # at all. Three outcomes, matched case-insensitively:
    #
    #   self_authors      -> production      your own output
    #   org (suffix)      -> internal_other  counted as neither
    #   anyone else       -> reception       an outside voice
    #
    # An org-mate's post is deliberately neither: it is not a response from
    # outside, and it is not evidence that *your* practice produced anything.
    self_authors:
      - "Oscar-UDAGAN"
    internal_suffix: "-UDAGAN"
    # Org members who signed up without the suffix.
    extra_internal: []

  # Reception: who found the work. Needs GITHUB_TOKEN in .env (classic PAT,
  # public_repo scope) — without it only the star/fork/watcher totals are
  # readable, and the traffic endpoints 403.
  #
  # GitHub retains traffic for 14 DAYS ONLY. A day not collected is gone for
  # good, which is why this is polled rather than backfilled.
  github:
    owner: "OscarSouth"
    repo: "theHarmonicAlgorithm"

  # Reception: subscribers and views. Uploads themselves are *production* — an
  # upload is a Reveal artefact; the audience's response to it is not.
  # Needs YOUTUBE_CLIENT_ID / _SECRET / _REFRESH_TOKEN in .env; run `flow auth
  # youtube` to obtain the refresh token.
  youtube:
    channel_id: "UCRnQfQgp_VAVjHBodthy3jA"

  # Embodiment — NOT an impact metric. `Train` is one lane and stays one lane;
  # this is a second observer of it, since the board can only record that a card
  # moved. Drop an Apple Health export.zip here (iPhone Health app -> profile ->
  # Export All Health Data). Re-importing an overlapping export is free: ids are
  # deterministic fingerprints, so the same session never lands twice.
  #
  # Only explicit workouts and body measurements are read. Step counts, stand
  # hours and activity rings are deliberately ignored — the watch is worn while
  # exercising or out of the house, so daily totals are missing-not-at-random.
  health:
    directory: "ingest"

history:
  start_date: 2026-08-16      # ISO date; first day the system was live.
                              # `flow sync` guarantees completeness from here to yesterday.
